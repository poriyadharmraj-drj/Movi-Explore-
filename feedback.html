<html>
<head>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: Arial;
            background: linear-gradient(135deg, #071a33, #0b3d5c, #123f5a);
        }

        .success {
            width: 400px;
            padding: 40px;
            text-align: center;
            background: rgba(255, 255, 255, 0.10);
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
        }

        .icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            font-size: 17px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #1e90ff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        a:hover {
            background: #1676d2;
        }
    </style>
</head>

<body>

    <div class="success">

        <div class="icon">✓</div>

        <h1>Feedback Submitted!</h1>

        <p>Thank you for your valuable feedback.</p>

        <p>Your response has been successfully submitted.</p>

        <a href="home.html">Back to Home</a>

    </div>

</body>
</html>
